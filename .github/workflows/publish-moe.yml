name: Build and Publish Multi-Arch Image (moe)

on:
  push:
    branches:
      - moe
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAGS=(
            "ghcr.io/ays7/ssh-tunnels-server:latest"
            "ghcr.io/ays7/ssh-tunnels-server:moe"
            "ghcr.io/ays7/ssh-tunnels-server:${SHORT_SHA}"
          )
          TAGS_CSV=$(IFS=,; echo "${TAGS[*]}")
          echo "tags=${TAGS_CSV}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ssh-tunnels-server
            org.opencontainers.image.description=Hardened SSH tunnel container
            org.opencontainers.image.source=https://github.com/ays7/docker-ssh
            org.opencontainers.image.revision=${{ github.sha }}
